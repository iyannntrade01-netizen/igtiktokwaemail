-<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Floating Button</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .social-floating {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: row; /* berjejer ke kiri */
      gap: 12px;
      z-index: 9999;
    }

    .social-floating a img {
      width: 45px;
      height: 45px;
      background: #ffffff;
      border-radius: 50%;
      padding: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: transform .2s;
      object-fit: cover;
    }

    .social-floating a img:hover {
      transform: scale(1.12);
    }
  </style>
</head>

<body>

  <!-- Floating Social Icons -->
  <div class="social-floating">

</body>
</html>
